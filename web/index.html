<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kompass</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>🚴 Kompass</h1>
    <p>Meilleure fenêtre horaire et stratégie de pacing pour un segment Strava</p>

    <!-- T-39 : squelette mécanique — aucun style poussé, seulement de quoi
         vérifier que fetch("/predict") et le rendu marchent de bout en
         bout. Le vrai travail de design (grille, cartes, typo) vient en
         T-40, une fois cette mécanique validée. -->
    <form id="predict-form">
      <label>
        Segment
        <select id="segment-select" required></select>
      </label>

      <label>
        Scénario de draft
        <select id="draft-select">
          <option value="solo">Solo</option>
          <option value="roue_collee">Roue collée</option>
          <option value="un_metre">Un mètre</option>
          <option value="groupe">Groupe</option>
        </select>
      </label>

      <label>
        Poids (toi + vélo, kg)
        <input id="mass-input" type="number" value="91" min="30" max="200" step="0.5" required />
      </label>

      <button type="submit">Chercher la meilleure fenêtre</button>
    </form>

    <p id="status"></p>
    <div id="results" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
